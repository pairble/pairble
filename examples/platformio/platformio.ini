; pairble in a PlatformIO project (ESP-IDF framework).
;
;   pio run -e esp32-s3 -t upload -t monitor
;
; pioarduino's platform: it follows ESP-IDF releases (pairble needs 5.1 or
; newer); the stock espressif32 platform is behind.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
; Wi-Fi + BLE + provisioning does not fit a 1 MB app partition. PlatformIO
; takes the table from here, not from sdkconfig.
board_build.partitions = partitions_singleapp_large.csv

[env:esp32]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
